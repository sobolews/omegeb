# Counters
# counter-divine-beast-enter      4  
# counter-divine-beast-done       4  
# counter-shrine                120  
# counter-tower                  15  
# counter-location              164  
# counter-korok                 900  
# counter-calamity-ganon          1  
# counter-dark-beast-ganon        1  
# Total                        1209  

presets:
  KorokLoc:
    presets: _Korok::$(0)
    notes: "(Discovers location: $(1))"
    vars:
      - counter-location: .add(1)

  Location:
    text: $(0)
    icon: location
    comment: Discover
    vars:
      - _x: $(1)
      - counter-location: .add(_x)
  
  map%:
    vars:
      - map-pct-items: .var(counter-location)
      - map-pct-items: .add(counter-korok)
      - map-pct-items: .add(counter-tower)
      - map-pct-items: .add(counter-shrine)
      - map-pct-items: .add(counter-calamity-ganon)
      - map-pct-items: .add(counter-dark-beast-ganon)
      - map-pct-items: .add(counter-divine-beast-done)
      - map-pct-items: .add(counter-divine-beast-enter)
      - map-pct: .var(map-pct-items)
      - map-pct: .mul(100)
      - map-pct: .div(map-pct-items-total)
      - map-mul-100: .var(map-pct)
      - map-mul-100: .mul(100)
      - map-floor: .var(map-pct)
      - map-floor: .sub(0.5)
    $(0): 'Map: .var(pad02:last3:map-floor).val(.).var(pad02:last2:map-mul-100)%'

  TowerWithMap%:
    text: ".loc($(0) Tower)"
    icon: tower
    icon-priority: 0
    counter: .var(counter-tower)
    coord: [$(1), $(2), $(3)]      
    vars:
      - map-pct-items: .var(counter-location)
      - map-pct-items: .add(counter-korok)
      - map-pct-items: .add(counter-tower)
      - map-pct-items: .add(counter-shrine)
      - map-pct-items: .add(counter-calamity-ganon)
      - map-pct-items: .add(counter-dark-beast-ganon)
      - map-pct-items: .add(counter-divine-beast-done)
      - map-pct-items: .add(counter-divine-beast-enter)
      - map-pct-items: .add(1)  # count this Tower
      - map-pct: .var(map-pct-items)
      - map-pct: .mul(100)
      - map-pct: .div(map-pct-items-total)
      - map-mul-100: .var(map-pct)
      - map-mul-100: .mul(100)
      - map-floor: .var(map-pct)
      - map-floor: .sub(0.5)
    comment: 'Map: .var(pad02:last3:map-floor).val(.).var(pad02:last2:map-mul-100)%'

  _TowerWithMap%:
    Central:
      presets: _TowerWithMap%<Central,-788.64,197.64,442.03>
    Lake:
      presets: _TowerWithMap%<Lake,-31.82,280.48,2961.60>
    DuelingPeaks:
      presets: _TowerWithMap%<Dueling Peaks,1016.78,184.01,1714.08>
    Faron:
