  _Boss:
    CalamityGanon:
      text: .boss(Calamity Ganon)
      counter: .var(counter-calamity-ganon)
      icon-doc: ganon
      icon-priority: 0
      movements:
          - push
          - to: [-254.00, 191.01, -1084.37]
            color: "#FFC0FA"
            icon: ganon
          - pop

    DarkBeastGanon:
      text: Dark Beast Ganon
      counter: .var(counter-dark-beast-ganon)
      icon: ganon
